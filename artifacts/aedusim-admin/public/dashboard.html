<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aedusim Admin Dashboard</title>
    <link rel="icon" href="/admin/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0a0a0a', 800: '#111111', 700: '#1a1a1a', 600: '#262626', 500: '#404040', 400: '#525252' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { scrollbar-width: thin; scrollbar-color: #404040 #0a0a0a; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #525252; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #a3a3a3; }
        .card { background: #111111; border: 1px solid #1f1f1f; border-radius: 12px; transition: border-color 0.2s; }
        .card:hover { border-color: #333333; }
        .input-field { background: #1a1a1a; border: 1px solid #333333; color: #e5e5e5; transition: all 0.2s; }
        .input-field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn-primary { background: #2563eb; color: white; transition: all 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
        .sidebar-item { transition: all 0.15s; border-radius: 8px; }
        .sidebar-item:hover { background: rgba(255,255,255,0.04); color: #e5e5e5; }
        .sidebar-item.active { background: rgba(255,255,255,0.06); color: #3b82f6; border-right: 2px solid #3b82f6; }
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in { animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .status-badge { padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; } .sidebar.open { transform: translateX(0); } }
        .table-row:hover { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body class="antialiased">
    <div id="app"></div>
    <div id="modalContainer"></div>
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

<script>
// ==================== CONFIGURATION ====================
const CONFIG = {
    ITEMS_PER_PAGE: 10,
    API_BASE: '/api/admin'
};

// ==================== STATE MANAGEMENT ====================
// NOTE: login system removed - dashboard loads directly as an authenticated admin.
let state = {
    authenticated: true,
    admin: { email: 'admin@aedusim.com', name: 'Administrator', role: 'owner', id: 'adm_001' },
    backendStats: null,
    currentView: 'dashboard',
    sidebarOpen: false,
    modal: null,
    data: { users: [], subscriptions: [], payments: [], coupons: [], plans: {}, logs: [] },
    filters: {
        users: { search: '', status: 'all', plan: 'all', page: 1 },
        payments: { search: '', status: 'all', dateRange: 'month', page: 1 },
        coupons: { search: '', status: 'all', page: 1 },
        logs: { search: '', page: 1 }
    }
};

// ==================== MOCK DATA GENERATOR ====================
function generateMockData() {
    const firstNames = ['Alex','Sarah','Michael','Emma','James','Olivia','William','Sophia','Benjamin','Isabella','Lucas','Mia','Henry','Charlotte','Alexander','Amelia','Daniel','Harper','Matthew','Evelyn'];
    const lastNames = ['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Gonzalez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Martin'];
    const plans = ['Free','Pro','Max'];
    const methods = ['Credit Card','PayPal','Stripe'];

    state.data.users = Array.from({length: 52}, (_, i) => {
        const plan = plans[Math.floor(Math.random() * plans.length)];
        const status = Math.random() > 0.88 ? 'suspended' : (Math.random() > 0.94 ? 'pending' : 'active');
        const created = new Date(Date.now() - Math.random() * 120 * 86400000);
        return {
            id: 'usr_' + (1000+i),
            name: firstNames[i%firstNames.length] + ' ' + lastNames[i%lastNames.length],
            email: firstNames[i%firstNames.length].toLowerCase() + '.' + lastNames[i%lastNames.length].toLowerCase() + '@email.com',
            plan, status,
            created: created.toISOString(),
            lastActive: new Date(Date.now() - Math.random() * 14 * 86400000).toISOString(),
            country: ['US','UK','CA','DE','FR','AU','JP','IN'][Math.floor(Math.random()*8)]
        };
    });

    state.data.subscriptions = state.data.users.map(u => {
        const endDate = u.plan === 'Free' ? null : new Date(Date.now() + Math.random() * 60 * 86400000);
        return {
            userId: u.id, userName: u.name, plan: u.plan,
            status: u.status === 'suspended' ? 'cancelled' : (u.plan === 'Free' ? 'active' : (Math.random() > 0.85 ? 'expired' : 'active')),
            startDate: u.created,
            endDate: endDate ? endDate.toISOString() : null,
            autoRenew: Math.random() > 0.25,
            trial: false
        };
    });

    state.data.payments = [];
    state.data.users.forEach(u => {
        if (u.plan !== 'Free') {
            const count = Math.floor(Math.random() * 4) + 1;
            for (let j=0; j<count; j++) {
                const status = Math.random() > 0.92 ? 'failed' : (Math.random() > 0.96 ? 'pending' : (Math.random() > 0.98 ? 'refunded' : 'successful'));
                state.data.payments.push({
                    id: 'TXN-' + Math.random().toString(36).substr(2,9).toUpperCase(),
                    userId: u.id, userName: u.name, plan: u.plan,
                    amount: u.plan === 'Pro' ? 29 : 99,
                    method: methods[Math.floor(Math.random()*methods.length)],
                    date: new Date(Date.now() - Math.random() * 90 * 86400000).toISOString(),
                    status
                });
            }
        }
    });
    state.data.payments.sort((a,b) => new Date(b.date) - new Date(a.date));

    state.data.coupons = [
        { id:'c1', code:'WELCOME20', type:'percentage', value:20, maxUses:100, usedCount:47, perUserMax:1, plan:'Both', minAmount:0, expiry:'2026-12-31', active:true, created:'2026-01-15' },
        { id:'c2', code:'PRO50OFF', type:'fixed', value:50, maxUses:50, usedCount:12, perUserMax:1, plan:'Pro', minAmount:29, expiry:'2026-08-15', active:true, created:'2026-03-10' },
        { id:'c3', code:'SUMMER2026', type:'percentage', value:15, maxUses:200, usedCount:89, perUserMax:2, plan:'Both', minAmount:0, expiry:'2026-09-01', active:true, created:'2026-05-20' },
        { id:'c4', code:'MAXDEAL', type:'percentage', value:30, maxUses:25, usedCount:25, perUserMax:1, plan:'Max', minAmount:99, expiry:'2026-07-01', active:false, created:'2026-04-01' },
        { id:'c5', code:'EARLYBIRD', type:'fixed', value:10, maxUses:500, usedCount:234, perUserMax:1, plan:'Both', minAmount:0, expiry:'2026-10-31', active:true, created:'2026-02-14' },
        { id:'c6', code:'FLASH25', type:'percentage', value:25, maxUses:75, usedCount:0, perUserMax:1, plan:'Pro', minAmount:0, expiry:'2026-08-30', active:true, created:'2026-07-20' }
    ];

    state.data.plans = {
        Free: { price:0, features:['Basic simulations','Limited storage (100MB)','Community support','Standard analytics'], limits:{simulations:5, storage:'100MB', support:'Community', api:false} },
        Pro: { price:29, features:['Unlimited simulations','10GB storage','Priority email support','Advanced analytics','Export capabilities'], limits:{simulations:-1, storage:'10GB', support:'Priority', api:false} },
        Max: { price:99, features:['Everything in Pro','100GB storage','Dedicated support','Team collaboration (5 seats)','API access','Custom integrations','White-label options'], limits:{simulations:-1, storage:'100GB', support:'Dedicated', api:true} }
    };

    state.data.logs = [
        { action:'Admin Login', admin:'admin@aedusim.com', target:'System', date:new Date(Date.now()-120000).toISOString(), ip:'192.168.1.105', device:'Chrome / macOS', details:'Successful 2FA verification' },
        { action:'User Suspended', admin:'admin@aedusim.com', target:'usr_1005 (Sarah Johnson)', date:new Date(Date.now()-3600000).toISOString(), ip:'192.168.1.105', device:'Chrome / macOS', details:'Policy violation - abuse report' },
        { action:'Subscription Changed', admin:'admin@aedusim.com', target:'usr_1012 (Michael Brown)', date:new Date(Date.now()-7200000).toISOString(), ip:'192.168.1.105', device:'Chrome / macOS', details:'Free to Pro (manual upgrade)' },
        { action:'Coupon Created', admin:'admin@aedusim.com', target:'FLASH25', date:new Date(Date.now()-86400000).toISOString(), ip:'192.168.1.105', device:'Chrome / macOS', details:'25% off Pro plans, 75 max uses' },
        { action:'Plan Settings Changed', admin:'admin@aedusim.com', target:'Pro', date:new Date(Date.now()-172800000).toISOString(), ip:'192.168.1.105', device:'Chrome / macOS', details:'Storage limit updated 5GB to 10GB' },
        { action:'Payment Refunded', admin:'admin@aedusim.com', target:'TXN-ABC123XYZ', date:new Date(Date.now()-259200000).toISOString(), ip:'192.168.1.105', device:'Chrome / macOS', details:'$29.00 refunded to user' },
        { action:'Failed Login Attempt', admin:'unknown', target:'System', date:new Date(Date.now()-300000).toISOString(), ip:'203.0.113.45', device:'Firefox / Windows', details:'Invalid password (2/3 attempts)' }
    ];
}

// ==================== UTILITY FUNCTIONS ====================
const fmt = {
    date: (d) => new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    dateTime: (d) => new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    currency: (n) => '$'+Number(n).toFixed(2),
    timeAgo: (d) => {
        const s = Math.floor((Date.now()-new Date(d))/1000);
        if (s<60) return 'Just now';
        const m = Math.floor(s/60);
        if (m<60) return m+'m ago';
        const h = Math.floor(m/60);
        if (h<24) return h+'h ago';
        const days = Math.floor(h/24);
        if (days<30) return days+'d ago';
        return fmt.date(d);
    },
    id: (p) => p+'_'+Math.random().toString(36).substr(2,8)
};

function showToast(message, type) {
    type = type || 'info';
    const colors = { success:'bg-emerald-500', error:'bg-red-500', warning:'bg-amber-500', info:'bg-blue-500' };
    const toast = document.createElement('div');
    toast.className = colors[type] + ' text-white px-4 py-3 rounded-lg shadow-xl slide-in flex items-center gap-2 min-w-[280px]';
    toast.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span class="text-sm font-medium">'+message+'</span>';
    document.getElementById('toastContainer').appendChild(toast);
    setTimeout(function() { toast.style.opacity='0'; toast.style.transform='translateY(10px)'; setTimeout(function(){toast.remove();},300); }, 3500);
}

function logActivity(action, target, details) {
    state.data.logs.unshift({
        action: action, target: target, details: details,
        admin: state.admin ? state.admin.email : 'system',
        date: new Date().toISOString(),
        ip: '192.168.1.105',
        device: 'Chrome / macOS'
    });
}

// ==================== MODAL SYSTEM ====================
function showModal(content, options) {
    options = options || {};
    state.modal = { content: content, options: options };
    var container = document.getElementById('modalContainer');
    var titleHtml = options.title ? '<div class="px-6 py-4 border-b border-[#262626] flex justify-between items-center"><h3 class="text-white font-semibold">' + options.title + '</h3><button onclick="closeModal()" class="text-gray-500 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div>' : '';
    var footerHtml = options.footer ? '<div class="px-6 py-4 border-t border-[#262626] flex justify-end gap-2">' + options.footer + '</div>' : '';
    container.innerHTML = '<div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onclick="if(event.target===this)closeModal()">' +
        '<div class="bg-[#111111] border border-[#333333] rounded-xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto slide-in" onclick="event.stopPropagation()">' +
        titleHtml + '<div class="p-6">' + content + '</div>' + footerHtml + '</div></div>';
    document.body.style.overflow = 'hidden';
}

function closeModal() { state.modal = null; document.getElementById('modalContainer').innerHTML = ''; document.body.style.overflow = ''; }

function confirmAction(message, onConfirm, options) {
    options = options || {};
    var content = '<p class="text-gray-300 text-sm">' + message + '</p>';
    var footer = '<button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</button>' +
        '<button onclick="(function(){' + onConfirm + ';closeModal();})()" class="px-4 py-2 text-sm rounded-lg ' + (options.danger ? 'btn-danger' : 'btn-primary') + ' font-medium">' + (options.confirmText || 'Confirm') + '</button>';
    showModal(content, { title: options.title || 'Confirm Action', footer: footer });
}

// ==================== MAIN RENDERER ====================
function render() {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="flex h-screen overflow-hidden bg-[#0a0a0a]">' + renderSidebar() +
        '<div class="flex-1 flex flex-col min-w-0">' + renderHeader() +
        '<main class="flex-1 overflow-y-auto p-4 md:p-6 fade-in" id="mainContent">' + renderView() + '</main></div></div>';
    if (state.sidebarOpen) document.body.style.overflow = 'hidden';
    else document.body.style.overflow = '';
    setTimeout(function() {
        if (state.currentView === 'dashboard') initDashboardCharts();
        if (state.currentView === 'revenue') initRevenueCharts();
    }, 50);
}

function renderSidebar() {
    var items = [
        { id:'dashboard', label:'Dashboard', icon:'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z' },
        { id:'users', label:'Users', icon:'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' },
        { id:'subscriptions', label:'Subscriptions', icon:'M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z' },
        { id:'revenue', label:'Payments & Revenue', icon:'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
        { id:'coupons', label:'Coupons', icon:'M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z' },
        { id:'plans', label:'Plans', icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
        { id:'logs', label:'Activity Logs', icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01' },
        { id:'settings', label:'Settings', icon:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z' }
    ];
    var navHtml = items.map(function(item) {
        var isActive = state.currentView === item.id;
        return '<button onclick="navigateTo(\'' + item.id + '\')" class="sidebar-item w-full flex items-center gap-3 px-3 py-2 text-sm ' + (isActive ? 'active' : 'text-gray-500') + '">' +
            '<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="' + item.icon + '"/></svg>' + item.label + '</button>';
    }).join('');

    return '<aside class="sidebar fixed md:relative z-40 w-64 h-full bg-[#111111] border-r border-[#1f1f1f] flex flex-col ' + (state.sidebarOpen ? 'open' : '') + '">' +
        '<div class="p-5 border-b border-[#1f1f1f] flex items-center gap-3">' +
        '<div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-900/20"><span class="text-white font-bold text-sm">A</span></div>' +
        '<div><span class="font-semibold text-white text-sm tracking-tight">Aedusim Admin</span><p class="text-[10px] text-gray-600">v2.0.0</p></div></div>' +
        '<nav class="flex-1 overflow-y-auto p-3 space-y-0.5">' + navHtml + '</nav></aside>' +
        (state.sidebarOpen ? '<div class="fixed inset-0 bg-black/60 z-30 md:hidden" onclick="toggleSidebar()"></div>' : '');
}

function renderHeader() {
    var titles = { dashboard:'Dashboard', users:'User Management', subscriptions:'Subscriptions', revenue:'Payments & Revenue', coupons:'Coupon Management', plans:'Plan Settings', logs:'Activity Logs', settings:'Admin Settings' };
    var stats = calculateStats();
    return '<header class="h-14 bg-[#111111]/90 backdrop-blur border-b border-[#1f1f1f] flex items-center justify-between px-4 md:px-6 sticky top-0 z-20">' +
        '<div class="flex items-center gap-3"><button onclick="toggleSidebar()" class="md:hidden p-1.5 hover:bg-[#1a1a1a] rounded-lg text-gray-500">' +
        '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>' +
        '<h2 class="text-sm font-semibold text-white">' + (titles[state.currentView] || 'Dashboard') + '</h2></div>' +
        '<div class="flex items-center gap-4">' +
        '<div class="hidden md:flex items-center gap-2 text-xs text-gray-600 bg-[#1a1a1a] px-3 py-1.5 rounded-full border border-[#262626]">' +
        '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span><span>' + stats.totalUsers + ' users</span>' +
        '<span class="text-[#333333]">|</span><span>$' + Math.floor(stats.monthlyRevenue) + ' this month</span></div>' +
        '<button onclick="logoutDashboard()" class="hidden sm:block px-3 py-1.5 text-xs text-gray-400 hover:text-white border border-[#333333] rounded-lg hover:bg-[#1a1a1a] transition">Sign out</button>' +
        '<div class="flex items-center gap-2"><div class="text-right hidden sm:block">' +
        '<p class="text-xs text-white font-medium">' + state.admin.name + '</p><p class="text-[10px] text-gray-600">' + state.admin.email + '</p></div>' +
        '<div class="w-8 h-8 bg-[#1a1a1a] border border-[#333333] rounded-full flex items-center justify-center text-xs font-bold text-white">A</div></div></div></header>';
}

function renderView() {
    switch(state.currentView) {
        case 'dashboard': return renderDashboard();
        case 'users': return renderUsers();
        case 'subscriptions': return renderSubscriptions();
        case 'revenue': return renderRevenue();
        case 'coupons': return renderCoupons();
        case 'plans': return renderPlans();
        case 'logs': return renderLogs();
        case 'settings': return renderSettings();
        default: return renderDashboard();
    }
}

// ==================== DASHBOARD VIEW ====================
function renderDashboard() {
    var s = calculateStats();
    return '<div class="space-y-6 max-w-7xl mx-auto">' +
        '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">' +

function statCard(title, value, change, color, icon) {
    var colors = { blue:'text-blue-400 bg-blue-500/10', emerald:'text-emerald-400 bg-emerald-500/10', purple:'text-purple-400 bg-purple-500/10', amber:'text-amber-400 bg-amber-500/10' };
    return '<div class="card p-5"><div class="flex items-start justify-between"><div>' +
        '<p class="text-xs text-gray-500 font-medium uppercase tracking-wider">' + title + '</p>' +
        '<p class="text-2xl font-bold text-white mt-1">' + value + '</p>' +
        '<p class="text-xs text-emerald-400 mt-1 font-medium">' + change + ' <span class="text-gray-600 font-normal">vs last month</span></p></div>' +
        '<div class="w-10 h-10 rounded-lg ' + colors[color] + ' flex items-center justify-center">' +
        '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="' + icon + '"/></svg></div></div></div>';
}

function calculateStats() {
    var users = state.data.users;
    var backend = state.backendStats;
    var now = new Date();
    var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    return {
        totalUsers: backend ? Number(backend.totalUsers) : users.length,
        activeUsers: backend ? Number(backend.dailyActiveUsers) : users.filter(function(u) { return u.status === 'active'; }).length,
        newUsers: backend ? Number(backend.newUsersMonth) : users.filter(function(u) { return new Date(u.created) > monthStart; }).length,
        freeUsers: backend ? Number(backend.planCounts?.free || 0) : users.filter(function(u) { return u.plan === 'Free'; }).length,
        proUsers: backend ? Number(backend.planCounts?.pro || 0) : users.filter(function(u) { return u.plan === 'Pro'; }).length,
        maxUsers: backend ? Number(backend.planCounts?.elite || 0) : users.filter(function(u) { return u.plan === 'Max'; }).length,
        monthlyRevenue: backend ? Number(backend.monthlyRevenue) : state.data.payments.filter(function(p) { return new Date(p.date) >= monthStart && p.status === 'successful'; }).reduce(function(sum,p) { return sum + p.amount; }, 0),
        totalRevenue: state.data.payments.filter(function(p) { return p.status === 'successful'; }).reduce(function(sum,p) { return sum + p.amount; }, 0),
        failedPayments: state.data.payments.filter(function(p) { return p.status === 'failed' && new Date(p.date) > new Date(Date.now()-30*86400000); }).length,
        activeCoupons: state.data.coupons.filter(function(c) { return c.active; }).length
    };
}

                '<button onclick="showUserActions(\'' + user.id + '\')" class="p-1.5 hover:bg-[#1a1a1a] rounded-lg text-gray-500 hover:text-white transition" title="Actions">' +
                '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg></button>' +
                '</div></td></tr>';

    var paginationHtml = totalPages > 1 ? '<div class="px-4 py-3 border-t border-[#1f1f1f] flex justify-between items-center">' +
        '<span class="text-xs text-gray-600">Page ' + page + ' of ' + totalPages + '</span>' +
        '<div class="flex gap-1">' +
        '<button onclick="updateFilter(\'users\',\'page\',' + (page-1) + ')" ' + (page<=1?'disabled':'') + ' class="px-3 py-1 text-xs rounded bg-[#1a1a1a] text-gray-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed">Previous</button>' +
        '<button onclick="updateFilter(\'users\',\'page\',' + (page+1) + ')" ' + (page>=totalPages?'disabled':'') + ' class="px-3 py-1 text-xs rounded bg-[#1a1a1a] text-gray-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed">Next</button></div></div>' : '';

        '<div class="flex gap-2 flex-1 flex-wrap">' +
        '<input type="text" id="userSearch" placeholder="Search by name or email..." value="' + state.filters.users.search + '" ' +
        'oninput="updateFilter(\'users\',\'search\',this.value)" class="input-field rounded-lg px-4 py-2 text-sm flex-1 min-w-[200px] max-w-xs">' +

function filterUsers() {
    return state.data.users.filter(function(u) {
        var s = state.filters.users.search.toLowerCase();
        var matchSearch = !s || u.name.toLowerCase().indexOf(s) > -1 || u.email.toLowerCase().indexOf(s) > -1 || u.id.toLowerCase().indexOf(s) > -1;
        var matchStatus = state.filters.users.status === 'all' || u.status === state.filters.users.status;
        var matchPlan = state.filters.users.plan === 'all' || u.plan === state.filters.users.plan;
        return matchSearch && matchStatus && matchPlan;
    });
}

function viewUser(userId) {
    var user = state.data.users.find(function(u) { return u.id === userId; });
    var sub = state.data.subscriptions.find(function(s) { return s.userId === userId; });
    if (!user) return;
    var subHtml = sub ? '<div class="bg-[#1a1a1a] rounded-lg p-3 col-span-2"><p class="text-gray-500 text-xs">Subscription</p>' +
        '<p class="text-white">' + sub.plan + ' &bull; ' + sub.status + (sub.endDate ? ' &bull; Expires ' + fmt.date(sub.endDate) : '') + (sub.autoRenew ? ' &bull; Auto-renew ON' : '') + '</p></div>' : '';
    showModal('<div class="space-y-4"><div class="flex items-center gap-4">' +
        '<div class="w-16 h-16 rounded-full bg-[#1a1a1a] border border-[#333333] flex items-center justify-center text-xl font-bold text-white">' +
        user.name.split(' ').map(function(n) { return n[0]; }).join('') + '</div>' +
        '<div><h4 class="text-lg font-bold text-white">' + user.name + '</h4><p class="text-sm text-gray-500">' + user.email + '</p>' +

        '<span class="status-badge ' + (user.status==='active'?'bg-emerald-500/10 text-emerald-400':user.status==='suspended'?'bg-red-500/10 text-red-400':'bg-amber-500/10 text-amber-400') + '">' + user.status + '</span></div></div></div>' +

        '<div class="bg-[#1a1a1a] rounded-lg p-3"><p class="text-gray-500 text-xs">User ID</p><p class="text-white font-mono">' + user.id + '</p></div>' +
        '<div class="bg-[#1a1a1a] rounded-lg p-3"><p class="text-gray-500 text-xs">Country</p><p class="text-white">' + user.country + '</p></div>' +

function showUserActions(userId) {

        actionsHtml += '<button onclick="closeModal(); suspendUser(\'' + user.id + '\')" class="w-full text-left px-4 py-3 rounded-lg bg-[#1a1a1a] hover:bg-[#262626] text-white text-sm transition flex items-center gap-3 mt-2">' +
            '<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>Suspend User</button>';

    var user = state.data.users.find(function(u) { return u.id === userId; });
    if (!user) return;
    showModal('<p class="text-gray-400 text-sm mb-4">Select a new plan for <strong class="text-white">' + user.name + '</strong>:</p>' +
        '<div class="space-y-2">' +
        '<button onclick="setUserPlan(\'' + userId + '\',\'Free\')" class="w-full text-left p-3 rounded-lg border ' + (user.plan==='Free'?'border-blue-500 bg-blue-500/5':'border-[#333333] bg-[#1a1a1a]') + ' hover:border-blue-500 transition"><p class="text-white font-medium">Free</p><p class="text-xs text-gray-500">Basic access, limited features</p></button>' +
        '<button onclick="setUserPlan(\'' + userId + '\',\'Pro\')" class="w-full text-left p-3 rounded-lg border ' + (user.plan==='Pro'?'border-blue-500 bg-blue-500/5':'border-[#333333] bg-[#1a1a1a]') + ' hover:border-blue-500 transition"><p class="text-white font-medium">Pro <span class="text-blue-400">$29/mo</span></p><p class="text-xs text-gray-500">Unlimited simulations, priority support</p></button>' +

        { title: 'Change Plan' });
}

function setUserPlan(userId, newPlan) {
    var user = state.data.users.find(function(u) { return u.id === userId; });
    var sub = state.data.subscriptions.find(function(s) { return s.userId === userId; });
    if (user) {
        var oldPlan = user.plan;
        user.plan = newPlan;
        if (sub) { sub.plan = newPlan; sub.status = 'active'; }
        logActivity('Subscription Changed', userId, oldPlan + ' to ' + newPlan);
        showToast('Plan updated to ' + newPlan, 'success');
        closeModal(); render();
    }
}

function suspendUser(userId) {
    var user = state.data.users.find(function(u) { return u.id === userId; });
    if (user) {
        user.status = 'suspended';
        var sub = state.data.subscriptions.find(function(s) { return s.userId === userId; });
        if (sub) sub.status = 'cancelled';
        logActivity('User Suspended', userId, 'Manual suspension by admin');
        showToast('User suspended', 'success'); render();
    }
}

function reactivateUser(userId) {
    var user = state.data.users.find(function(u) { return u.id === userId; });
    if (user) {
        user.status = 'active';
        var sub = state.data.subscriptions.find(function(s) { return s.userId === userId; });
        if (sub) sub.status = 'active';
        logActivity('User Reactivated', userId, 'Manual reactivation by admin');
        showToast('User reactivated', 'success'); render();
    }
}

function confirmDeleteUser(userId) {
    var user = state.data.users.find(function(u) { return u.id === userId; });
    if (!user) return;
    confirmAction('Are you sure you want to permanently delete <strong class="text-white">' + user.name + '</strong>? This action cannot be undone and all user data will be removed.',
        'deleteUserFinal(\'' + userId + '\')', { danger: true, title: 'Delete User', confirmText: 'Delete Permanently' });
}

function deleteUserFinal(userId) {
    state.data.users = state.data.users.filter(function(u) { return u.id !== userId; });
    state.data.subscriptions = state.data.subscriptions.filter(function(s) { return s.userId !== userId; });
    logActivity('User Deleted', userId, 'Permanent deletion by admin');
    showToast('User deleted permanently', 'success'); render();
}

function extendSubscription(userId) {
    var sub = state.data.subscriptions.find(function(s) { return s.userId === userId; });

function calculateRevenueStats() {
    var successful = state.data.payments.filter(function(p) { return p.status === 'successful'; });
    var now = new Date();
    var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    return {
        total: successful.reduce(function(sum,p) { return sum + p.amount; }, 0),
        thisMonth: successful.filter(function(p) { return new Date(p.date) >= monthStart; }).reduce(function(sum,p) { return sum + p.amount; }, 0),
        successful: successful.length,
        failed: state.data.payments.filter(function(p) { return p.status === 'failed'; }).length
    };
}

function filterPayments() {
    return state.data.payments.filter(function(p) {
        var s = state.filters.payments.search.toLowerCase();
        var matchSearch = !s || p.id.toLowerCase().indexOf(s) > -1 || p.userName.toLowerCase().indexOf(s) > -1;
        var matchStatus = state.filters.payments.status === 'all' || p.status === state.filters.payments.status;
        return matchSearch && matchStatus;
    });
}

        '<div class="grid grid-cols-2 gap-3"><div><label class="block text-xs text-gray-500 mb-1">Applicable Plan</label><select id="newCouponPlan" class="w-full input-field rounded-lg px-4 py-2 text-sm"><option value="Both">Both</option><option value="Pro">Pro</option><option value="Max">Max</option></select></div>' +
        '<div><label class="block text-xs text-gray-500 mb-1">Expiry Date</label><input type="date" id="newCouponExpiry" class="w-full input-field rounded-lg px-4 py-2 text-sm"></div></div></div>',
        { title: 'Create New Coupon',
          footer: '<button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button><button onclick="createCoupon()" class="px-4 py-2 text-sm rounded-lg btn-primary font-medium">Create Coupon</button>' });
}

function createCoupon() {
    var code = document.getElementById('newCouponCode').value.toUpperCase();
    var type = document.getElementById('newCouponType').value;
    var value = parseFloat(document.getElementById('newCouponValue').value) || 0;
    var maxUses = parseInt(document.getElementById('newCouponMaxUses').value) || 100;
    var perUser = parseInt(document.getElementById('newCouponPerUser').value) || 1;
    var plan = document.getElementById('newCouponPlan').value;
    var expiry = document.getElementById('newCouponExpiry').value || new Date(Date.now()+30*86400000).toISOString().split('T')[0];

    if (!code) { showToast('Please enter a coupon code', 'error'); return; }
    if (state.data.coupons.find(function(c) { return c.code === code; })) { showToast('Coupon code already exists', 'error'); return; }

    state.data.coupons.push({
        id: fmt.id('c'), code: code, type: type, value: value, maxUses: maxUses, usedCount: 0,
        perUserMax: perUser, plan: plan, minAmount: 0, expiry: expiry, active: true,
        created: new Date().toISOString().split('T')[0]
    });
    logActivity('Coupon Created', code, value + (type==='percentage'?'%':'$') + ' discount');
    showToast('Coupon created successfully', 'success');
    closeModal(); render();
}

function editCoupon(couponId) {
    var coupon = state.data.coupons.find(function(c) { return c.id === couponId; });
    if (!coupon) return;
    showModal('<div class="space-y-4">' +
        '<div><label class="block text-xs text-gray-500 mb-1">Coupon Code</label><input type="text" id="editCouponCode" value="' + coupon.code + '" class="w-full input-field rounded-lg px-4 py-2 text-sm font-mono uppercase"></div>' +
        '<div class="grid grid-cols-2 gap-3"><div><label class="block text-xs text-gray-500 mb-1">Discount Type</label><select id="editCouponType" class="w-full input-field rounded-lg px-4 py-2 text-sm"><option value="percentage" ' + (coupon.type==='percentage'?'selected':'') + '>Percentage (%)</option><option value="fixed" ' + (coupon.type==='fixed'?'selected':'') + '>Fixed Amount ($)</option></select></div>' +
        '<div><label class="block text-xs text-gray-500 mb-1">Value</label><input type="number" id="editCouponValue" value="' + coupon.value + '" class="w-full input-field rounded-lg px-4 py-2 text-sm"></div></div>' +
        '<div class="grid grid-cols-2 gap-3"><div><label class="block text-xs text-gray-500 mb-1">Max Uses</label><input type="number" id="editCouponMaxUses" value="' + coupon.maxUses + '" class="w-full input-field rounded-lg px-4 py-2 text-sm"></div>' +
        '<div><label class="block text-xs text-gray-500 mb-1">Expiry Date</label><input type="date" id="editCouponExpiry" value="' + coupon.expiry + '" class="w-full input-field rounded-lg px-4 py-2 text-sm"></div></div></div>',
        { title: 'Edit Coupon: ' + coupon.code,
          footer: '<button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button><button onclick="saveCouponEdit(\'' + couponId + '\')" class="px-4 py-2 text-sm rounded-lg btn-primary font-medium">Save Changes</button>' });
}

function saveCouponEdit(couponId) {
    var coupon = state.data.coupons.find(function(c) { return c.id === couponId; });
    if (coupon) {
        coupon.code = document.getElementById('editCouponCode').value.toUpperCase();
        coupon.type = document.getElementById('editCouponType').value;
        coupon.value = parseFloat(document.getElementById('editCouponValue').value) || 0;
        coupon.maxUses = parseInt(document.getElementById('editCouponMaxUses').value) || 100;
        coupon.expiry = document.getElementById('editCouponExpiry').value;
        logActivity('Coupon Updated', coupon.code, 'Settings modified');
        showToast('Coupon updated', 'success'); closeModal(); render();
    }
}

function toggleCoupon(couponId) {
    var coupon = state.data.coupons.find(function(c) { return c.id === couponId; });
    if (coupon) {
        coupon.active = !coupon.active;
        logActivity(coupon.active ? 'Coupon Enabled' : 'Coupon Disabled', coupon.code, 'Status changed');
        showToast('Coupon ' + (coupon.active ? 'enabled' : 'disabled'), 'success'); render();
    }
}

function deleteCoupon(couponId) {
    var coupon = state.data.coupons.find(function(c) { return c.id === couponId; });
    if (!coupon) return;
    confirmAction('Are you sure you want to delete coupon <strong class="text-white">' + coupon.code + '</strong>? This cannot be undone.',
        'state.data.coupons = state.data.coupons.filter(function(c){return c.id!=="' + couponId + '"}); logActivity("Coupon Deleted","' + coupon.code + '","Permanent deletion"); showToast("Coupon deleted","success"); render();',
        { danger: true, title: 'Delete Coupon', confirmText: 'Delete' });
}

// ==================== PLANS VIEW ====================
function renderPlans() {

        '<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">' +
        Object.keys(plans).map(function(name) {
            var plan = plans[name];
            var borderClass = name === 'Pro' ? 'border-blue-500/20' : name === 'Max' ? 'border-purple-500/20' : '';
            var priceColor = name === 'Pro' ? 'text-blue-400' : name === 'Max' ? 'text-purple-400' : 'text-gray-400';
            return '<div class="card rounded-xl p-6 ' + borderClass + '">' +
                '<div class="flex justify-between items-start mb-4"><div>' +
                '<h3 class="text-xl font-bold text-white">' + name + '</h3>' +
                '<p class="text-2xl font-bold ' + priceColor + ' mt-1">' + (plan.price === 0 ? 'Free' : '$' + plan.price + '/mo') + '</p></div>' +
                '<button onclick="editPlan(\'' + name + '\')" class="p-2 hover:bg-[#1a1a1a] rounded-lg text-gray-400 hover:text-white transition">' +
                '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg></button></div>' +
                '<div class="space-y-4"><div><p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Features</p><ul class="space-y-2">' +
                plan.features.map(function(f) { return '<li class="text-sm text-gray-300 flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>' + f + '</li>'; }).join('') +
                '</ul></div><div><p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Limits</p>' +
                '<div class="space-y-1.5 text-sm text-gray-400">' +
                '<p class="flex justify-between"><span>Simulations</span><span class="text-white">' + (plan.limits.simulations === -1 ? 'Unlimited' : plan.limits.simulations) + '</span></p>' +
                '<p class="flex justify-between"><span>Storage</span><span class="text-white">' + plan.limits.storage + '</span></p>' +
                '<p class="flex justify-between"><span>Support</span><span class="text-white">' + plan.limits.support + '</span></p>' +
                '<p class="flex justify-between"><span>API Access</span><span class="' + (plan.limits.api ? 'text-emerald-400' : 'text-gray-600') + '">' + (plan.limits.api ? 'Yes' : 'No') + '</span></p></div></div></div></div>';
        }).join('') + '</div></div>';
}

function editPlan(planName) {
    var plan = state.data.plans[planName];
    showModal('<div class="space-y-4">' +
        '<div><label class="block text-xs text-gray-500 mb-1">Plan Name</label><input type="text" value="' + planName + '" disabled class="w-full bg-[#1a1a1a] border border-[#333333] rounded-lg px-4 py-2 text-gray-500 text-sm cursor-not-allowed"></div>' +
        '<div><label class="block text-xs text-gray-500 mb-1">Monthly Price ($)</label><input type="number" id="editPlanPrice" value="' + plan.price + '" class="w-full input-field rounded-lg px-4 py-2 text-sm"></div>' +
        '<div><label class="block text-xs text-gray-500 mb-1">Simulations Limit (-1 for unlimited)</label><input type="number" id="editPlanSims" value="' + plan.limits.simulations + '" class="w-full input-field rounded-lg px-4 py-2 text-sm"></div>' +
        '<div><label class="block text-xs text-gray-500 mb-1">Storage</label><input type="text" id="editPlanStorage" value="' + plan.limits.storage + '" class="w-full input-field rounded-lg px-4 py-2 text-sm"></div></div>',
        { title: 'Edit Plan: ' + planName,
          footer: '<button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button><button onclick="savePlanEdit(\'' + planName + '\')" class="px-4 py-2 text-sm rounded-lg btn-primary font-medium">Save Changes</button>' });
}

function savePlanEdit(planName) {
    var plan = state.data.plans[planName];
    var newPrice = parseFloat(document.getElementById('editPlanPrice').value);
    var newSims = parseInt(document.getElementById('editPlanSims').value);
    var newStorage = document.getElementById('editPlanStorage').value;
    if (plan) {
        plan.price = newPrice;
        plan.limits.simulations = newSims;
        plan.limits.storage = newStorage;
        logActivity('Plan Settings Changed', planName, 'Price $' + newPrice + ', Storage ' + newStorage);
        showToast('Plan settings updated', 'success'); closeModal(); render();
    }
}

// ==================== LOGS VIEW ====================
function renderLogs() {
    var filtered = state.data.logs.filter(function(l) {
        var s = state.filters.logs.search.toLowerCase();
        return !s || l.action.toLowerCase().indexOf(s) > -1 || l.target.toLowerCase().indexOf(s) > -1 || l.admin.toLowerCase().indexOf(s) > -1;
    });
    var rowsHtml = filtered.map(function(log) {
        var iconColor = log.action.indexOf('Failed') > -1 || log.action.indexOf('Delete') > -1 ? 'text-red-400' : log.action.indexOf('Login') > -1 ? 'text-emerald-400' : 'text-blue-400';
        return '<tr class="table-row transition">' +
            '<td class="px-4 py-3"><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ' + (log.action.indexOf('Failed') > -1 ? 'bg-red-500' : 'bg-blue-500') + '"></span><span class="text-white text-sm font-medium">' + log.action + '</span></div></td>' +
            '<td class="px-4 py-3 text-gray-400 text-sm">' + log.admin + '</td>' +
            '<td class="px-4 py-3 text-gray-400 text-sm">' + log.target + '</td>' +
            '<td class="px-4 py-3 text-gray-500 text-xs max-w-xs truncate">' + log.details + '</td>' +
            '<td class="px-4 py-3 text-gray-500 text-xs font-mono">' + log.ip + '</td>' +
            '<td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">' + fmt.dateTime(log.date) + '</td></tr>';
    }).join('');

    return '<div class="space-y-4 max-w-7xl mx-auto">' +
        '<div class="flex gap-2"><input type="text" placeholder="Search logs..." value="' + state.filters.logs.search + '" oninput="updateFilter(\'logs\',\'search\',this.value)" class="input-field rounded-lg px-4 py-2 text-sm flex-1 max-w-xs">' +
        '<div class="text-xs text-gray-600 flex items-center">' + filtered.length + ' entries</div></div>' +
        '<div class="card rounded-xl overflow-hidden">' +
        '<div class="overflow-x-auto"><table class="w-full text-sm text-left">' +
        '<thead class="text-xs text-gray-500 uppercase bg-[#1a1a1a]"><tr>' +
        '<th class="px-4 py-3">Action</th><th class="px-4 py-3">Admin</th><th class="px-4 py-3">Target</th>' +
        '<th class="px-4 py-3">Details</th><th class="px-4 py-3">IP Address</th><th class="px-4 py-3">Date</th></tr></thead>' +
        '<tbody class="divide-y divide-[#1f1f1f]">' + rowsHtml + '</tbody></table></div></div></div>';
}

// ==================== SETTINGS VIEW ====================
function renderSettings() {
    return '<div class="max-w-2xl mx-auto space-y-6">' +
        '<div class="card rounded-xl p-6"><h3 class="text-white font-medium mb-4">Admin Profile</h3>' +

        '<div class="w-16 h-16 rounded-full bg-[#1a1a1a] border border-[#333333] flex items-center justify-center text-2xl font-bold text-white">A</div>' +
        '<div><p class="text-white font-medium">' + state.admin.name + '</p><p class="text-sm text-gray-500">' + state.admin.role + '</p></div></div>' +

// ==================== EVENT HANDLERS ====================
function navigateTo(view) {
    state.currentView = view;
    state.sidebarOpen = false;
    render();
}

function toggleSidebar() {
    state.sidebarOpen = !state.sidebarOpen;
    render();
}

function updateFilter(section, key, value) {
    state.filters[section][key] = value;
    if (key !== 'page') state.filters[section].page = 1;
    render();
}

// ==================== BACKEND + INITIALIZATION ====================
async function loadBackendData() {
    var token = localStorage.getItem('admin_token');
    if (!token) return;
    var headers = { 'Authorization': 'Bearer ' + token };
    try {
        var statsResponse = await fetch(CONFIG.API_BASE + '/stats', { headers: headers });
        if (statsResponse.ok) state.backendStats = await statsResponse.json();

        var usersResponse = await fetch(CONFIG.API_BASE + '/users', { headers: headers });
        if (usersResponse.ok) {
            var users = await usersResponse.json();
            if (Array.isArray(users) && users.length) {
                state.data.users = users.map(function(u) {
                    var plan = String(u.plan || 'free').toLowerCase();
                    return {
                        id: String(u.id),
                        name: u.name || u.email || 'Aedusim learner',
                        email: u.email || '—',
                        plan: plan === 'elite' ? 'Max' : plan === 'pro' ? 'Pro' : 'Free',
                        status: u.banned ? 'suspended' : 'active',
                        created: u.createdAt || new Date().toISOString(),
                        lastActive: u.updatedAt || u.createdAt || new Date().toISOString(),
                        country: '—'
                    };
                });
            }
        }
        var activityResponse = await fetch(CONFIG.API_BASE + '/activity', { headers: headers });
        if (activityResponse.ok) {
            var activity = await activityResponse.json();
            if (Array.isArray(activity) && activity.length) {
                state.data.logs = activity.slice(0, 12).map(function(entry) {
                    return {
                        action: entry.type || 'Activity',
                        admin: state.admin.email,
                        target: entry.description || 'System',
                        date: entry.time || new Date().toISOString(),
                        ip: '—',
                        device: 'Aedusim',
                        details: entry.meta || ''
                    };
                });
            }
        }
    } catch (error) {
        console.warn('Admin data refresh failed; showing available dashboard data.', error);
    }
}

function logoutDashboard() {
    window.parent.postMessage({ type: 'admin-logout' }, window.location.origin);
}

async function init() {
    generateMockData();
    await loadBackendData();
    render();
}

// Start the application
init();
</script>
